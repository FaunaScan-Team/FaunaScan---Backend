spring.application.name=FaunaScan

# credenciales en .env (no se sube a git) o en variables de entorno
spring.config.import=optional:file:.env[.properties]


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/FaunaScanDB}
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.web.error.include-stacktrace=never

debug=true

logging.level.root=INFO
logging.level.org.springframework.web=info
logging.file.name=logs/api.log

ip.frontend=${FRONTEND_URL:http://localhost:4200}

jwt.secret=${JWT_SECRET}

# IA simulada (HU-37, HU-38, HU-51)
ia.umbral-confianza=0.70
ia.tiempo-maximo-ms=5000
ia.meta-precision=0.85

# HU-59: recordatorios diarios a las 9:00 (hora de Lima)
recordatorios.cron=0 0 9 * * *
